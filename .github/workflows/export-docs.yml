name: Export Docs

on:
  workflow_dispatch:
    inputs:
      export_scope:
        description: Files to export
        required: true
        default: all
        type: choice
        options:
          - all
          - candidate-roles

permissions:
  contents: read

jobs:
  export:
    name: Export review files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: inputs.export_scope == 'all'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install document export tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make pandoc libreoffice-writer fonts-liberation poppler-utils unzip zip perl

      - name: Install slide export tool
        if: inputs.export_scope == 'all'
        run: |
          npm install --global @marp-team/marp-cli

      - name: Create candidate role materials
        if: inputs.export_scope == 'candidate-roles'
        run: make candidate-roles

      - name: Upload candidate role materials
        if: inputs.export_scope == 'candidate-roles'
        uses: actions/upload-artifact@v7
        with:
          name: kbc-candidate-role-descriptions
          path: |
            dist/exports/kingsville-baptist-church-treasurer-financial-officer-role-description.pdf
            dist/exports/kingsville-baptist-church-treasurer-financial-officer-role-description.docx
            dist/exports/kingsville-baptist-church-bookkeeper-financial-administrator-job-description.pdf
            dist/exports/kingsville-baptist-church-bookkeeper-financial-administrator-job-description.docx
          if-no-files-found: error

      - name: Create release packet
        if: inputs.export_scope == 'all'
        run: make release

      - name: Upload generated exports
        if: inputs.export_scope == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: kbc-financial-operations-exports
          path: dist/exports/
          if-no-files-found: error

      - name: Upload release packet
        if: inputs.export_scope == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: kbc-financial-operations-release
          path: dist/releases/
          if-no-files-found: error
